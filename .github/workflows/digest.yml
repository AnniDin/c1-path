name: Weekly trick email
# Every Thursday at 9:00 Spanish time: sends this week's trick to the people who switched the emails on (see supabase/digest.sql).
# Needs four repository secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, GMAIL_USER, GMAIL_APP_PASSWORD.
# GitHub pauses scheduled workflows after 60 days without repository activity: push anything, or run it by hand, to wake it.
on:
  schedule:
    # GitHub cron is in UTC. 9:00 in Spain is 07:00 UTC in summer and 08:00 UTC in winter, so there are two runs; the script only
    # sends when it is Thursday and 9:00 or later in Madrid, and nobody is mailed twice in 6 days, so exactly one of them sends.
    - cron: '0 7 * * 4'
    - cron: '0 8 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only build the email, send nothing'
        type: boolean
        default: true
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save nodemailer
      - name: Send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EVENT: ${{ github.event_name }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then node tools/send_digest.js --dry-run; else node tools/send_digest.js; fi
