name: Validate content
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate-node.js
      - name: Behaviour tests
        run: node tools/test.js
      - name: Render every page
        run: node tools/smoke.js
      - name: End-to-end checks in headless Chrome (pages, quizzes, axe-core, phone width, light and dark)
        run: node tools/e2e.js
      - name: Syntax check scripts
        run: for f in js/*.js data/*.js sw.js; do node --check "$f"; done
